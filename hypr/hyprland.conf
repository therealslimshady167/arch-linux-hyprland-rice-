general {
    border_size = 4
    col.active_border = rgba(39ff14ff)
    col.inactive_border = rgba(39ff1433)
}

# Use the default lua config from https://github.com/hyprwm/Hyprland/blob/main/example/hyprland.lua



$mainMod = SUPER
$terminal = kitty
$fileManager = dolphin
$menu = wofi --show drun

bind = SUPER, O, exec, ~/.local/bin/odysseus
bind = SUPER, R, exec, rofi -show drun
bind = $mainMod, W, exec, firefox
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%-
bind = $mainMod, F, fullscreen,
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, K, exec, $menu
monitor=,preferred,auto,1
bind = $mainMod, S, exec, code
exec-once = waybar
exec-once = hyprpaper
exec-once = python ~/.config/eww/scripts/audio/audio_visualizer.py
exec-once = cava -p ~/.config/cava/config >/tmp/cava.log 2>&1 &
exec-once = eww -c ~/.config/eww daemon
input {
    natural_scroll = false
    scroll_factor = 1.0
}

# ── Workspace switching ─────────────────────────────
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4

# Move the focused window to a workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4


# Calendar Widget
windowrule = float true, match:class ^(com.beastmaster64.CalendarWidget)$

bind = SUPER, D, exec, ~/.local/bin/calendar-widget.py
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
